---
deployment:
  tasks:
    - >-
      /bin/bash -lc 'set -euo pipefail; DEPLOYPATH="/home/smashpad/public_html"; REPO_ROOT="${CPANEL_REPO_ROOT:-${GIT_WORK_TREE:-$PWD}}"; cd "$REPO_ROOT"; echo "Deploy path: $DEPLOYPATH"; echo "Repo cwd: $(pwd)"; command -v node >/dev/null 2>&1 || { echo "Node.js is not available in cPanel for this deploy."; exit 1; }; command -v npm >/dev/null 2>&1 || { echo "npm is not available in cPanel for this deploy."; exit 1; }; echo "Node: $(node -v)"; echo "npm: $(npm -v)"; mkdir -p "$DEPLOYPATH"; if ! npm ci --no-audit --no-fund; then echo "npm ci failed, retrying with npm install"; npm install --no-audit --no-fund; fi; npm run build; if [ ! -d out ]; then echo "Expected static export directory ./out was not generated."; exit 1; fi; if command -v rsync >/dev/null 2>&1; then rsync -a --delete out/ "$DEPLOYPATH/"; else find "$DEPLOYPATH" -mindepth 1 -maxdepth 1 ! -name ".well-known" -exec rm -rf {} +; cp -R out/. "$DEPLOYPATH/"; fi; echo "Deploy done: $(date)"'
